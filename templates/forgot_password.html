{% extends 'auth_base.html' %}
{% block title %}Forgot Password — Library Management System{% endblock %}
{% block content %}

<h1 class="page-title">Forgot Password?</h1>
<p class="auth-sub">Enter your email and we'll send you a 6-digit reset code.</p>

<form class="auth-form" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Email
    <input type="email" name="email" required autofocus>
  </label>

  <button type="submit" class="btn btn-primary auth-submit">Send Reset Code</button>
  <p class="auth-switch">Remember your password? <a href="{{ url_for('login') }}">Log in</a></p>
</form>

{% endblock %}

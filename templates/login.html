{% extends 'auth_base.html' %}
{% block title %}Log In — Library Management System{% endblock %}
{% block content %}

<h1 class="page-title">Welcome Back</h1>
<p class="auth-sub">Log in to manage the shelves.</p>

<form class="auth-form" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Username
    <input type="text" name="username" required autofocus>
  </label>
  <label>Password
    <input type="password" name="password" required>
  </label>

  <button type="submit" class="btn btn-primary auth-submit">Log In</button>
  <p class="auth-switch">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</form>

{% endblock %}

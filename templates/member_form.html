{% extends 'base.html' %}
{% block title %}{{ 'Edit' if member else 'Add' }} Member — Library Management System{% endblock %}
{% block content %}

<h1 class="page-title">{{ 'Edit Member' if member else 'Add Member' }}</h1>

<form class="form-panel" method="post">
  <label>Full Name
    <input type="text" name="name" required value="{{ member.name if member else '' }}">
  </label>
  <label>Email
    <input type="email" name="email" required value="{{ member.email if member else '' }}">
  </label>
  <label>Phone
    <input type="text" name="phone" value="{{ member.phone if member else '' }}">
  </label>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary">{{ 'Save Changes' if member else 'Add Member' }}</button>
    <a href="{{ url_for('members') }}" class="btn btn-ghost">Cancel</a>
  </div>
</form>

{% endblock %}

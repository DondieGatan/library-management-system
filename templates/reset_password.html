{% extends 'auth_base.html' %}
{% block title %}Reset Password — Library Management System{% endblock %}
{% block content %}

<h1 class="page-title">Set New Password</h1>
<p class="auth-sub">Create a strong password for your account.</p>

<form class="auth-form" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>New Password
    <input type="password" name="password" required minlength="8" autofocus>
  </label>
  <label>Confirm New Password
    <input type="password" name="confirm_password" required minlength="8">
  </label>

  <button type="submit" class="btn btn-primary auth-submit">Reset Password</button>
  <p class="auth-switch"><a href="{{ url_for('login') }}">Back to sign in</a></p>
</form>

{% endblock %}
